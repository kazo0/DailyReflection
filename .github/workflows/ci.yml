name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HEAD_PROJECT: DailyReflection/DailyReflection.Uno.csproj

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Presentation tests
        run: dotnet test DailyReflection.Presentation.Tests/DailyReflection.Presentation.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results

      - name: Services tests
        run: dotnet test DailyReflection.Services.Tests/DailyReflection.Services.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # dotnet format loads the head like a build does; keep it on the desktop TFM.
      TargetFrameworkOverride: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: XAML (XamlStyler, Settings.XamlStyler)
        run: |
          dotnet tool restore
          dotnet xstyler --passive --recursive --config Settings.XamlStyler --directory DailyReflection

      # whitespace + style only. Plain `dotnet format` also applies every referenced
      # analyzer's code fixes, and the Android platform-compat analyzers (CA1416/CA1422)
      # report diagnostics their fixers cannot apply, which would fail the check forever.
      - name: C# (dotnet format, .editorconfig)
        run: |
          dotnet format whitespace DailyReflection.slnx --verify-no-changes
          dotnet format style DailyReflection.slnx --verify-no-changes

  build-desktop:
    name: Build desktop (Skia)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Restricts the head project to this platform, so restore never pulls in the
      # mobile TFMs (and their workloads). MSBuild reads it as a property.
      TargetFrameworkOverride: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          # Nerdbank.GitVersioning needs full history to compute the version
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build head for desktop
        run: dotnet build "$HEAD_PROJECT" -f net10.0-desktop -c Release

  build-android:
    name: Build Android (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TargetFrameworkOverride: android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Use JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install missing Android SDK components
        run: dotnet build "$HEAD_PROJECT" -f net10.0-android -c Release -t:InstallAndroidDependencies -p:AcceptAndroidSDKLicenses=true

      - name: Build head for Android
        run: dotnet build "$HEAD_PROJECT" -f net10.0-android -c Release

      # dotnet format only sees the files compiled for the TFM it loads; the Formatting
      # job runs on desktop, so Android-only sources (*.Android.cs, Platforms/) are checked here.
      - name: Check formatting of Android-only sources
        run: |
          dotnet format whitespace "$HEAD_PROJECT" --verify-no-changes
          dotnet format style "$HEAD_PROJECT" --verify-no-changes

  build-ios:
    name: Build iOS (simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TargetFrameworkOverride: ios
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # 'dotnet workload install ios' below takes the newest iOS workload, which
      # requires the newest Xcode — but the runner image's default selection lags
      # behind it (.NET for iOS 26.5.10301 needs Xcode 26.6; macos-26 defaults to
      # 26.5 with 26.6 also installed). Select the newest to keep the two in step.
      #
      # '-type d' matters: the image ships each Xcode as a real bundle plus version
      # alias symlinks (Xcode_26.6.app + Xcode_26.6.0.app), and selecting the symlink
      # breaks SDK resolution — actool then fails with "MacOSX.sdk cannot be located"
      # (actions/runner-images#13743). Version-sorting also ranks the alias first.
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          for xcode in $(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -Vr); do
            if [ -d "$xcode/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode"
              xcodebuild -version
              xcrun --find actool
              exit 0
            fi
            echo "Skipping $xcode (no macOS SDK)"
          done
          echo "::error::No Xcode with a usable macOS SDK found"
          exit 1

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Build head for iOS simulator
        run: dotnet build "$HEAD_PROJECT" -f net10.0-ios -c Release -p:RuntimeIdentifier=iossimulator-arm64

      # dotnet format only sees the files compiled for the TFM it loads; the Formatting
      # job runs on desktop, so iOS-only sources (*.iOS.cs, Platforms/) are checked here.
      - name: Check formatting of iOS-only sources
        run: |
          dotnet format whitespace "$HEAD_PROJECT" --verify-no-changes
          dotnet format style "$HEAD_PROJECT" --verify-no-changes
