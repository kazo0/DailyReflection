name: Clean up web previews

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List closed-PR deployments without deleting them
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete closed-PR previews
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pull_request_target has secrets: never check out or execute PR-head code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'dailyreflection' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const cleanup = require('./scripts/pr-preview-cleanup/cleanup.cjs');
            await cleanup({ github, context, core });
