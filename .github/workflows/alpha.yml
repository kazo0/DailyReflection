name: Alpha

# Every merge to master that touches app code builds the same Native AOT store
# packages release.yml ships, signs them with the production credentials, and
# pushes them to the Google Play *internal* track and to TestFlight. The point
# is that the build reaching your device is the one the stores would get —
# trimming bugs that only appear under Native AOT surface here, weeks before a
# release branch exists, instead of during a release.
#
# Docs-only merges are skipped: every upload consumes a store build number, and
# those are derived from the git height (see docs/RELEASE-SETUP.md, "Versioning").
#
# Nothing here can reach production or App Store review, so there is no approval
# gate: Play uploads target the internal track only, and the iOS build is
# uploaded for TestFlight without a review submission. release.yml remains the
# only path to a public release.
#
# The build and signing steps deliberately mirror release.yml's — keep the two
# in sync. (A shared reusable workflow would be the tidier expression of that;
# it is deliberately left for a follow-up so this change does not touch the
# release path before its first real run.)

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - '.gitattributes'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  # A newer merge supersedes an alpha build that is still running
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HEAD_PROJECT: DailyReflection/DailyReflection.Uno.csproj

jobs:
  build-android:
    name: Build signed Android package
    runs-on: ubuntu-latest
    # Native AOT compiles the app twice (android-arm64 + android-x64).
    timeout-minutes: 90
    env:
      # Restricts the head project to this platform, so restore never pulls in the
      # other TFMs (and their workloads). MSBuild reads it as a property.
      TargetFrameworkOverride: android
    steps:
      - uses: actions/checkout@v7
        with:
          # Nerdbank.GitVersioning needs full history to compute the version
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Use JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install missing Android SDK components
        run: dotnet build "$HEAD_PROJECT" -f net10.0-android -c Release -t:InstallAndroidDependencies -p:AcceptAndroidSDKLicenses=true

      - name: Decode keystore
        run: printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # Signed with the production upload key on purpose: Play only accepts a
      # bundle on any track, internal included, if it carries the app's key.
      - name: Publish signed .aab
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish "$HEAD_PROJECT" -f net10.0-android -c Release \
            -p:PublishNativeAot=true \
            -p:AndroidNdkDirectory="$ANDROID_NDK_HOME" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -o artifacts/android

      - uses: actions/upload-artifact@v7
        with:
          name: android-alpha
          path: artifacts/android/*.aab
          if-no-files-found: error

  build-ios:
    name: Build signed iOS package
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TargetFrameworkOverride: ios
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # See the matching comment in ci.yml — the newest iOS workload requires a
      # newer Xcode than the runner image selects by default, and the version
      # alias symlinks must be avoided when selecting it.
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          for xcode in $(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -Vr); do
            if [ -d "$xcode/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode"
              xcodebuild -version
              xcrun --find actool
              exit 0
            fi
            echo "Skipping $xcode (no macOS SDK)"
          done
          echo "::error::No Xcode with a usable macOS SDK found"
          exit 1

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_P12_PASSWORD }}

      # TestFlight builds use the same App Store distribution profile a release
      # does — TestFlight is fed by App Store Connect, not by an ad-hoc profile.
      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.kazo0.dailyreflection
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Publish signed .ipa
        run: |
          dotnet publish "$HEAD_PROJECT" -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:PublishNativeAot=true \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="${{ vars.APPLE_CODESIGN_KEY }}" \
            -p:CodesignProvision="${{ vars.APPLE_PROFILE_NAME }}" \
            -o artifacts/ios

      - uses: actions/upload-artifact@v7
        with:
          name: ios-alpha
          path: artifacts/ios/*.ipa
          if-no-files-found: error

  publish:
    name: Publish to internal testing
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [build-android, build-ios]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Upload .aab to the Play internal track
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kazo0.dailyreflection
          releaseFiles: dist/android-alpha/*.aab
          track: internal
          status: completed

      - name: Build App Store Connect API key file
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          jq -n --arg key_id "$APPSTORE_KEY_ID" \
                --arg issuer_id "$APPSTORE_ISSUER_ID" \
                --arg key "$APPSTORE_PRIVATE_KEY" \
                '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
                > "$RUNNER_TEMP/asc_api_key.json"

      # 'pilot' rather than release.yml's 'deliver': it uploads a build for
      # TestFlight without touching the App Store version record or review
      # queue. skip_waiting_for_build_processing returns as soon as the upload
      # lands — Apple's processing then takes a few minutes, after which the
      # build appears for internal testers (a changelog cannot be set in that
      # mode, which is why none is passed).
      - name: Upload .ipa to TestFlight
        run: |
          set -euo pipefail
          ipa="$(ls dist/ios-alpha/*.ipa | head -n 1)"
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --app_identifier com.kazo0.dailyreflection \
            --ipa "$ipa" \
            --skip_waiting_for_build_processing true
